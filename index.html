<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Mugeshkumar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }body {
  background: #e6f0ff;
  color: #003366;
}

header {
  background: #004080;
  color: white;
  padding: 1rem 2rem;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 1000;
  transition: background 0.3s;
}

nav a {
  margin: 0 1rem;
  color: white;
  text-decoration: none;
  transition: color 0.3s;
}

nav a:hover {
  color: #aad4ff;
}

section {
  padding: 4rem 2rem;
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

h2 {
  margin-bottom: 1rem;
  color: #00264d;
}

.skills, .certificates {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1rem;
}

.skill, .certificate {
  background: #cce0ff;
  padding: 1rem;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: transform 0.3s;
  text-align: center;
}

.skill:hover, .certificate:hover {
  transform: scale(1.05);
}

.certificate img {
  width: 100%;
  border-radius: 5px;
  margin-top: 0.5rem;
}

form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  max-width: 400px;
  margin: auto;
}

input, textarea {
  padding: 0.75rem;
  border-radius: 5px;
  border: 1px solid #99c2ff;
}

button {
  background: #004080;
  color: white;
  padding: 0.75rem;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.3s;
}

button:hover {
  background: #0059b3;
}

.profile-pic {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 1rem;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

  </style>
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#certificates">Certificates</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>  <section id="about">
    <h2>About Me</h2>
    <img src="profile.png" alt="Profile Picture" class="profile-pic" />
    <p>Hello! I'm a passionate developer focused on building responsive and engaging web experiences.</p>
  </section>  <section id="skills">
    <h2>Skills</h2>
    <div class="skills">
      <div class="skill">HTML</div>
      <div class="skill">CSS</div>
      <div class="skill">JavaScript</div>
      <div class="skill">React</div>
    </div>
  </section>  <section id="certificates">
    <h2>Certificates</h2>
    <div class="certificates">
      <div class="certificate">
        
        <img src="1.jpg" alt="Certificate 1" />
      </div>
      <div class="certificate">
        
        <img src="2.jpg" alt="Certificate 2" />
      </div>
    </div>
  </section>  <section id="contact">
    <h2>Contact</h2>
    <form>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea rows="4" placeholder="Your Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
</body>
</html>
